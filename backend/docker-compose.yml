services:
  db:
    image: postgres:16-alpine
    container_name: matchrecruiter_db
    restart: always
    environment:
      POSTGRES_USER: matchuser
      POSTGRES_PASSWORD: matchpassword
      POSTGRES_DB: matchrecruiter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchuser -d matchrecruiter"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matchrecruiter_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://matchuser:matchpassword@db:5432/matchrecruiter
      - SECRET_KEY=supersecretjwtkey_change_in_production_1234567890
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GOOGLE_CLIENT_ID=mock_google_client_id
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
